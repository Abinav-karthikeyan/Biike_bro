services:
  - type: web
    name: cycle-buddy-api
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GBFS_INGEST_ENABLED
        value: "false"
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: GROQ_API_KEY
        sync: false   # set this secret manually in the Render dashboard
